<body>

  <!-- Main Card Component -->
  <main>
    <article class="card">
      <div class="card__image-container">
        <img src="./assets/images/illustration-article.svg"
          alt="Abstract illustration representing HTML and CSS web structure" class="card__image" width="336"
          height="200">
      </div>

      <div class="card__content">
        <span class="card__tag">Learning</span>
        <time datetime="2023-12-21" class="card__date">Published 21 Dec 2023</time>

        <h1 class="card__title">
          <a href="#" class="card__link">HTML &amp; CSS foundations</a>
        </h1>

        <p class="card__description">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </div>

      <div class="card__author">
        <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="card__author-avatar" width="32"
          height="32">
        <span class="card__author-name">Greg Hooper</span>
      </div>
    </article>
  </main>

  <!-- Footer Attribution -->
  <footer class="attribution visually-hidden">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://github.com/muchiribytes" target="_blank">Muchiri Bytes</a>.
  </footer>
